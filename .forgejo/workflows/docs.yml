name: Docs
concurrency:
  group: pages
  cancel-in-progress: false
on:
  push:
    tags:
      - "[0-9]+.*"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://github.com/jdx/mise-action@v5
        with:
          install_args: bun
          cache: false
          github_token: ""
      - name: Install dependencies
        run: bun install --cwd docs/site --frozen-lockfile
      - name: Build
        run: bun run --cwd docs/site docs:build
      - name: Check output
        run: test -s docs/site/.vitepress/dist/index.html
      - name: Publish Pages
        env:
          PAGES_TOKEN: ${{ forgejo.token }}
        run: |-
          curl -fsSL https://codeberg.org/git-pages/git-pages-cli/releases/download/v1.13.0/git-pages-cli.linux-amd64 -o "$RUNNER_TEMP/git-pages-cli"
          echo "dca13dee2bdc4b26d19840a25904c93d6514578688c78d54ddee61c00901cf37  $RUNNER_TEMP/git-pages-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/git-pages-cli"
          "$RUNNER_TEMP/git-pages-cli" https://doing.aaronmallen.dev/ \
            --server 192.168.1.238:30180 --token "$PAGES_TOKEN" \
            --upload-dir docs/site/.vitepress/dist/ --parents --strict --comment "$GITHUB_SHA"
